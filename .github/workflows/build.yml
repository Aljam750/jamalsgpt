name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android project
        run: flutter create . --platforms=android --org com.jamals --project-name jamalsgpt
      - name: Add INTERNET permission and app name
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="JamalsGPT"#' android/app/src/main/AndroidManifest.xml
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk JamalsGPT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JamalsGPT-apk
          path: JamalsGPT.apk
